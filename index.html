<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="影跟子读音抖版">
<meta name="theme-color" content="#000000">
<title>影跟子读音抖版</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= 视频流 ======================= -->
<main id="videoContainer" class="video-container">

  <!-- 视频卡片（由JS动态生成） -->
  <div class="video-feed" id="videoFeed"></div>

  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="brand-row">
      <div class="app-brand">LEO</div>
      <div class="app-name">影跟子读音抖版</div>
      <div class="disclaimer-btn" id="disclaimerBtn">ⓘ</div>
    </div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">全部</button>
      <!-- 星级/主题筛选由JS注入 -->
    </div>
  </div>


  <!-- 底部提示 -->
  <div class="bottom-hint">
    <div class="phase-dots" id="phaseDots">
      <div class="phase-dot active"></div>
      <div class="phase-dot"></div>
      <div class="phase-dot"></div>
    </div>
    <div class="phase-label" id="phaseLabel">第一遍 · 听</div>
  </div>

  <!-- 免责声明弹窗 -->
  <div class="disclaimer-overlay" id="disclaimerOverlay">
    <div class="disclaimer-modal">
      <div class="disclaimer-title">📜 免责声明</div>
      <div class="disclaimer-body" id="disclaimerBody">
        <p><b>1. 内容版权</b><br>
        本应用中的视频、音频及文字内容来自第三方英语学习平台（shadowtalk），
        素材版权归原作者/平台所有。本应用仅用于学习交流，不用于任何商业用途。</p>
        <p><b>2. 使用说明</b><br>
        本应用为学习辅助工具，视频内容仅代表作者个人观点，
        请结合正规教材与课堂学习使用。</p>
        <p><b>3. 隐私保护</b><br>
        本应用不收集、不上传任何个人隐私信息，所有学习记录仅保存在本机。</p>
        <p><b>4. 网络与设备</b><br>
        本应用需要网络加载视频内容，请在网络环境良好的情况下使用。</p>
        <p><b>5. 最终解释权</b><br>
        本应用最终解释权归开发者所有。</p>
      </div>
      <button class="disclaimer-ok" id="disclaimerOk">我已知晓</button>
    </div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="js/content.js?v=3"></script>
<script src="js/player.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
