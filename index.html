<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>LEO · 刷着学英语</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ======================= 视频流 ======================= -->
<main id="videoContainer" class="video-container">

  <!-- 视频卡片（由JS动态生成） -->
  <div class="video-feed" id="videoFeed"></div>

  <!-- 顶部栏 -->
  <div class="top-bar">
    <div class="app-brand">LEO</div>
    <div class="filter-row" id="filterRow">
      <button class="filter-chip active" data-filter="all">全部</button>
      <!-- 星级/主题筛选由JS注入 -->
    </div>
  </div>


  <!-- 底部提示 -->
  <div class="bottom-hint">
    <div class="phase-dots" id="phaseDots">
      <div class="phase-dot active"></div>
      <div class="phase-dot"></div>
      <div class="phase-dot"></div>
    </div>
    <div class="phase-label" id="phaseLabel">第一遍 · 听</div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script src="js/content.js?v=2"></script>
<script src="js/player.js?v=2"></script>
<script src="js/app.js?v=2"></script>
</body>
</html>
